name: Deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy to Fly
    needs: test
    # Only deploy on a push to master, skips PRs and feature branches
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Serialize deploys so two quick pushes can't run fly deploy against the app at once
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6
        with:
          version: 0.4.59

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
